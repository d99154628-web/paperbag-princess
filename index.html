<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>종이 봉지 공주 역할극</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=Andika:wght@400;700&display=swap">
<style>
/* Layout: a puppet-theater stage (cut-paper scene, left) beside a kraft-paper script sheet (right); scene tabs above, prompter controls below. Single committed look. */
:root{
  --night:#1d2740;      /* theater backdrop */
  --night-2:#28345a;
  --kraft:#c99a62;      /* paper-bag brown, the hero material */
  --kraft-dk:#8a6237;
  --sheet:#f7efe1;      /* script paper */
  --ink:#2a2118;
  --ink-soft:#6d5c48;
  --flame:#e8643a;
  --gold:#f2c14e;
  --c-P:#d9622b; --c-R:#2f6fb8; --c-F:#9a4fb0; --c-D:#2f8a4a; --c-N:#7a6a58;
  --f-display:"Jua","Gowun Dodum",system-ui,sans-serif;
  --f-body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-en:"Andika","Gowun Dodum",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--night);color:var(--sheet);font-family:var(--f-body);font-size:16px;margin:0}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.app{display:grid;grid-template-rows:auto 1fr auto;height:100%;padding-inline:16px;padding-block:10px;gap:10px;max-width:1600px;margin:0 auto}

/* tabs */
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-size:1.35rem;color:var(--kraft);letter-spacing:.02em;white-space:nowrap}
.tabs{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:0}
.tab{background:transparent;border:1.5px solid #ffffff2a;border-radius:999px;padding:6px 13px;font-family:var(--f-display);font-size:1rem;color:#e9dcc6}
.tab small{opacity:.7;margin-left:4px;font-family:var(--f-body);font-size:.8rem}
.tab[aria-current="true"]{background:var(--kraft);border-color:var(--kraft);color:var(--ink)}
.tab:hover{border-color:var(--kraft)}
.iconbtn{background:#ffffff14;border:0;border-radius:10px;padding:7px 11px;font-size:.92rem}
.iconbtn[aria-pressed="true"]{background:var(--gold);color:var(--ink)}

/* main */
.main{min-height:0;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:14px}
.stagewrap{min-width:0;min-height:0;display:flex;flex-direction:column;gap:8px}
.stage{position:relative;background:var(--night-2);border-radius:14px;overflow:hidden;box-shadow:0 0 0 6px var(--kraft-dk),0 18px 40px #0007;aspect-ratio:800/520;max-width:100%;max-height:100%;margin:auto;width:100%}
.stage svg,.stage img{display:block;width:100%;height:100%;object-fit:cover}
.scenecap{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.scenecap h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:1.7rem;color:var(--sheet);text-wrap:balance}
.scenecap .place{color:var(--kraft);font-size:.95rem}
.badge{display:inline-block;font-size:.78rem;padding:2px 9px;border-radius:999px;background:var(--flame);color:#fff;margin-left:8px;vertical-align:middle;font-family:var(--f-body)}
.imgtools{display:flex;gap:6px}
a.iconbtn{color:inherit;text-decoration:none;display:inline-flex;align-items:center}
.sheetlink{background:var(--gold);color:var(--ink)!important;font-weight:700}
.sheetlink:hover{filter:brightness(1.08)}
.top-sheet{background:transparent;color:var(--gold)!important;box-shadow:inset 0 0 0 2px var(--gold)}
.top-sheet:hover{background:#f2c14e22}
.imgtools .iconbtn{font-size:.8rem;padding:5px 9px}

.sheet{min-width:0;min-height:0;background:var(--sheet);color:var(--ink);border-radius:6px 6px 14px 14px;display:flex;flex-direction:column;box-shadow:0 18px 40px #0006;position:relative}
.sheet::before{content:"";position:absolute;inset:0 0 auto 0;height:10px;background:radial-gradient(circle at 8px -2px,var(--night) 7px,transparent 7.5px) 0 0/22px 10px repeat-x;border-radius:6px 6px 0 0}
.sheethead{padding:18px 18px 8px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;border-bottom:1.5px dashed #c9b597}
.sheethead b{font-family:var(--f-display);font-weight:400;font-size:1.15rem}
.lines{overflow:auto;padding:10px 12px 18px;display:flex;flex-direction:column;gap:6px;scroll-behavior:smooth}
.line{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;border:2px solid transparent;text-align:left;background:transparent;width:100%}
.line:hover{background:#00000008}
.line.cur{border-color:var(--ink);background:#fff;box-shadow:0 3px 0 var(--ink)}
.line.done{opacity:.55}
.chip{font-family:var(--f-display);font-size:1rem;color:#fff;border-radius:8px;padding:4px 0;text-align:center;line-height:1.15}
.chip small{display:block;font-family:var(--f-en);font-size:.68rem;opacity:.9}
.en{font-family:var(--f-en);font-size:1.45rem;line-height:1.3;color:var(--ink);min-width:0;overflow-wrap:anywhere}
.ko{display:block;font-family:var(--f-body);font-size:.92rem;color:var(--ink-soft);margin-top:2px}
.hide-ko .ko{display:none}
.key .en{font-weight:700}
.blank{display:inline-block;min-width:4.5em;border-bottom:3px solid var(--flame);color:transparent}
.hidden-line .en{filter:blur(9px);user-select:none}
.hidden-line .ko{filter:blur(6px)}
.hidden-line.revealed .en,.hidden-line.revealed .ko{filter:none}
.say{width:40px;height:40px;border-radius:50%;border:2px solid var(--ink);background:var(--sheet);display:grid;place-items:center;font-size:1rem}
.say:hover{background:var(--gold)}
.line.narr{grid-template-columns:76px minmax(0,1fr) auto}
.line.narr .story{font-size:1.05rem;color:var(--ink-soft);line-height:1.55}
.line.narr .chip{background:transparent;color:var(--c-N);border:1.5px dashed var(--c-N)}
.hide-narr .line.narr{display:none}

.endpick{display:flex;gap:8px;padding:10px 12px 0;flex-wrap:wrap}
.endpick button{border:2px solid var(--ink);border-radius:10px;background:transparent;padding:8px 12px;text-align:left;flex:1;min-width:140px}
.endpick button[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}
.endpick b{font-family:var(--f-display);font-weight:400;font-size:1.05rem;display:block}

/* controls */
.ctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.big{background:var(--kraft);color:var(--ink);border:0;border-radius:12px;padding:10px 18px;font-family:var(--f-display);font-size:1.15rem;box-shadow:0 4px 0 var(--kraft-dk)}
.big:active{transform:translateY(3px);box-shadow:0 1px 0 var(--kraft-dk)}
.big.alt{background:#ffffff1c;color:var(--sheet);box-shadow:0 4px 0 #0005}
.big[aria-pressed="true"]{background:var(--gold);color:var(--ink)}
.sep{width:1px;height:28px;background:#ffffff2a}
.ctrl label{display:flex;align-items:center;gap:6px;font-size:.92rem;color:#e9dcc6}
.ctrl select{font:inherit;background:#ffffff14;color:var(--sheet);border:1px solid #ffffff33;border-radius:8px;padding:6px 8px}
.ctrl select option{color:#000}

/* full pages (cover, story, roles, tools) */
.page{grid-column:1/-1;min-height:0;overflow:auto;padding-block:6px}
.cover{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:center;height:100%}
.cover h1{font-family:var(--f-display);font-weight:400;font-size:clamp(2.2rem,5vw,4.2rem);line-height:1.1;margin:0 0 12px;color:var(--sheet);text-wrap:balance}
.cover h1 em{font-style:normal;color:var(--kraft)}
.eyebrow{font-size:.9rem;letter-spacing:.12em;color:var(--kraft);margin-bottom:10px}
.cover p{font-size:1.15rem;line-height:1.7;color:#e9dcc6;max-width:34em}
.goal{margin-top:18px;background:#ffffff10;border-radius:12px;padding:14px 18px;display:grid;gap:6px}
.goal span{font-family:var(--f-en);font-size:1.25rem;color:var(--gold)}
.cardgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.rcard{background:var(--sheet);color:var(--ink);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.rcard svg{width:100%;height:auto;background:#efe2c8;border-radius:10px}
.rcard h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:1.5rem}
.rcard h3 small{font-family:var(--f-en);font-size:1rem;color:var(--ink-soft);margin-left:6px}
.rcard p{margin:0;line-height:1.55;font-size:.98rem}
.rcard .count{font-size:.85rem;color:var(--ink-soft)}
.rcard .tip{font-family:var(--f-en);font-size:1.05rem;border-top:1.5px dashed #c9b597;padding-top:8px}
.ptitle{font-family:var(--f-display);font-weight:400;font-size:2rem;margin:4px 0 14px}
.storycols{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:20px}
.storybox{background:var(--sheet);color:var(--ink);border-radius:14px;padding:22px 26px;line-height:1.85;font-size:1.12rem}
.storybox p{margin:0 0 12px}
.storybox .src{font-size:.9rem;color:var(--ink-soft)}
.cmp{display:grid;gap:10px}
.qcard{background:#ffffff10;border-radius:12px;padding:14px 16px}
.qcard b{font-family:var(--f-display);font-weight:400;font-size:1.2rem;color:var(--gold)}
.qcard .ans{margin-top:8px;line-height:1.6;color:#efe3cf}
.qcard button{margin-top:8px}
.tools{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.tool{background:var(--sheet);color:var(--ink);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.tool h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:1.45rem}
.timer{font-family:var(--f-en);font-weight:700;font-size:clamp(3rem,7vw,5.5rem);text-align:center;font-variant-numeric:tabular-nums;line-height:1}
.timer.over{color:var(--flame)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{border:2px solid var(--ink);border-radius:999px;padding:6px 14px;background:transparent}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}
.dark{background:var(--ink);color:var(--sheet);border:0;border-radius:10px;padding:9px 16px;font-family:var(--f-display);font-size:1.05rem}
.order{list-style:none;padding:0;margin:0;display:grid;gap:6px;counter-reset:o}
.order li{counter-increment:o;display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-size:1.3rem;padding:6px 10px;background:#00000008;border-radius:10px}
.order li::before{content:counter(o) "번째";font-size:.85rem;color:var(--ink-soft);width:3.6em}
.stars{display:grid;gap:8px}
.stars div{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:1.05rem}
.stars span{color:var(--flame);font-size:1.4rem;letter-spacing:.1em}
.thornopts{display:grid;gap:8px;padding:12px}
.topt{border:2px solid var(--ink);border-radius:12px;background:#fff;padding:10px 12px;text-align:left;display:grid;gap:4px}
.topt[aria-pressed="true"]{background:var(--gold)}
.topt b{font-family:var(--f-display);font-weight:400;font-size:1.1rem}
.topt .en{font-size:1.15rem}

/* svg animation */
.bob{animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.shake{animation:shake .5s linear 2}
@keyframes shake{25%{transform:translate(-6px,3px)}50%{transform:translate(5px,-3px)}75%{transform:translate(-3px,2px)}}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .7s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{from{transform:scale(0) rotate(-20deg);opacity:0}to{transform:none;opacity:1}}
.flame{animation:flame 1.4s ease-out both;transform-box:fill-box;transform-origin:right center}
@keyframes flame{0%{transform:scaleX(0);opacity:0}20%{opacity:1}70%{transform:scaleX(1);opacity:1}100%{transform:scaleX(1.05);opacity:0}}
.flyoff{animation:flyoff 2.2s ease-in both}
@keyframes flyoff{to{transform:translate(520px,-320px) scale(.5)}}
.zoom{animation:zoom 2.4s ease-in-out both}
@keyframes zoom{0%{transform:none}40%{transform:translate(-900px,-120px)}41%{transform:translate(900px,-120px)}100%{transform:none}}
.fade{animation:fade 1.6s ease both}
@keyframes fade{to{opacity:0}}
.grow{animation:grow 1.2s ease-out both;transform-box:fill-box;transform-origin:left center}
@keyframes grow{from{transform:scaleX(0)}}
.zz text{animation:zz 2s ease-in-out infinite}
@keyframes zz{0%{opacity:0;transform:translate(0,10px)}50%{opacity:1}100%{opacity:0;transform:translate(14px,-16px)}}
.dance{animation:dance .9s ease-in-out infinite alternate}
@keyframes dance{from{transform:translateY(0) rotate(-6deg)}to{transform:translateY(-16px) rotate(6deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}

@media (max-width:1000px){
  .main{grid-template-columns:minmax(0,1fr)}
  .app{height:auto;min-height:100%}
  .lines{max-height:none}
  .cover,.storycols{grid-template-columns:minmax(0,1fr)}
  .cardgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tools{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:520px){
  .cardgrid{grid-template-columns:minmax(0,1fr)}
  .line{grid-template-columns:58px minmax(0,1fr) auto}
  .en{font-size:1.2rem}
  .brand{display:none}
}
[hidden]{display:none!important}
.stage{aspect-ratio:16/9}
.stage>img,#scimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:filter .9s ease}
.stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
#scimg.mystery{filter:blur(16px) brightness(.75) saturate(.8)}
.mtext{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-size:clamp(1.4rem,3vw,2.4rem);color:#fff;text-shadow:0 3px 12px #000a;text-align:center;padding:0 16px}
.fadein{animation:fadein .6s ease both}
@keyframes fadein{from{opacity:.25}to{opacity:1}}
#itempop{position:absolute;right:4%;top:6%;width:24%;aspect-ratio:1;border-radius:50%;overflow:hidden;box-shadow:0 0 0 6px var(--gold),0 10px 30px #0008;background:#fff;z-index:2}
#itempop img{width:100%;height:100%;object-fit:cover}
.popin{animation:pop .7s cubic-bezier(.3,1.6,.5,1) both}
#vidlayer{position:absolute;inset:0;z-index:3;background:#000}
.vclose{position:absolute;right:10px;top:10px;z-index:4;background:#000a;color:#fff;border:1px solid #fff6;border-radius:999px;padding:6px 12px;font-family:var(--f-display);cursor:pointer}
.acts2{display:flex;gap:6px;align-items:center}
.vidbtn{width:40px;height:40px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-size:1.05rem;background:#fff}
.vidbtn:hover{background:var(--gold)}
.rcard img.portrait{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;background:#efe2c8}
@media (max-width:1750px){.brand{display:none}}
</style>
</head>
<body>


<div class="app" id="app">
  <header class="top">
    <div class="brand">종이 봉지 공주의 왕자 구출 대작전</div>
    <nav class="tabs" id="tabs" aria-label="장면"></nav>
    <button class="iconbtn" id="bgmBtn" aria-pressed="true" title="배경음악 켜기/끄기">배경음악</button>
    <button class="iconbtn" id="sfxBtn" aria-pressed="true" title="효과음 켜기/끄기">효과음</button>
    <a class="iconbtn sheetlink top-sheet" href="worksheet.html" target="_blank" rel="noopener" title="학생 학습지를 새 창에서 열어 인쇄해요">학습지 ↗</a>
    <button class="iconbtn" id="fsBtn" title="전체 화면">전체 화면</button>
  </header>
  <main class="main" id="main"></main>
  <footer class="ctrl" id="ctrl"></footer>
</div>
<input type="file" id="imgInput" accept="image/*" hidden>

  let p='';for(let i=0;i<14;i++){const a=i/14*Math.PI;p+=`<path d="M${Math.cos(a)*-120} ${-Math.sin(a)*90} l${10*Math.cos(a+1.6)} ${-10*Math.sin(a+1.6)} l${-Math.cos(a)*-26} ${Math.sin(a)*-26}Z" fill="#1f3a26"/>`}
  return `<g transform="translate(${x} ${y}) scale(${s})" filter="url(#paper)"><ellipse cx="0" cy="0" rx="130" ry="96" fill="#2f5a36"/><ellipse cx="-40" cy="-20" rx="70" ry="60" fill="#3c6d42"/><ellipse cx="50" cy="-10" rx="70" ry="64" fill="#2a5030"/>${p}<path d="M-90 -10 l-16 -8 M-50 -60 l-10 -16 M20 -70 l4 -18 M70 -40 l16 -10 M100 0 l18 0 M-30 20 l-12 12 M40 30 l10 14" stroke="#c9d6a0" stroke-width="5" stroke-linecap="round"/></g>`;
}

function lastFx(lines,i){ return lines[i] && lines[i].fx; }
function svgWrap(inner){return `<svg viewBox="0 0 800 520" xmlns="http://www.w3.org/2000/svg" role="img">${defs}${inner}${grainRect()}</svg>`}

/* ---------- speech ---------- */
let voices=[];
function loadVoices(){ try{voices=speechSynthesis.getVoices()}catch(e){} }
if('speechSynthesis' in window){ loadVoices(); speechSynthesis.onvoiceschanged=loadVoices; }
function pickVoice(lang){
  const v=voices.filter(v=>v.lang&&v.lang.replace('_','-').toLowerCase().startsWith(lang));
  const pref=v.find(x=>/google|natural|online|samantha|aria|jenny/i.test(x.name));
  return pref||v[0]||null;
}
const VOICE={P:{pitch:1.3,rate:1},R:{pitch:.95,rate:1},F:{pitch:1.7,rate:1.05},D:{pitch:.35,rate:.82}};
function speak(text,role){
  return new Promise(res=>{
    if(!('speechSynthesis' in window)){res();return}
    const isKo = role==='N';
    const clean = text.replace(/Zzz…?/g,'').replace(/…/g,', ').replace(/\(.*?\)/g,'').trim();
    if(!clean){setTimeout(res,600);return}
    const u=new SpeechSynthesisUtterance(clean);
    u.lang=isKo?'ko-KR':'en-US';
    const v=pickVoice(isKo?'ko':'en-us')||pickVoice(isKo?'ko':'en'); if(v)u.voice=v;
    const p=VOICE[role]||{pitch:1,rate:1};
    u.pitch=p.pitch; u.rate=(isKo?1:p.rate)*S.rate*(isKo?1.1:1);
    let done=false; const fin=()=>{if(!done){done=true;res()}};
    u.onend=fin; u.onerror=fin;
    setTimeout(fin, 900 + clean.length*140/S.rate);
    speechSynthesis.speak(u);
  });
}
function stopSpeech(){ try{speechSynthesis.cancel()}catch(e){} S.playing=false; }

/* ---------- sound fx ---------- */
let ac=null;
function ctx(){ if(!ac){ try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){} } return ac; }
function noise(dur,f0,f1,gain=.4,type='lowpass'){
  const a=ctx(); if(!a||!S.sfx)return;
  const b=a.createBuffer(1,a.sampleRate*dur,a.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1);
  const s=a.createBufferSource();s.buffer=b;
  const f=a.createBiquadFilter();f.type=type;f.frequency.setValueAtTime(f0,a.currentTime);f.frequency.exponentialRampToValueAtTime(f1,a.currentTime+dur);
  const g=a.createGain();g.gain.setValueAtTime(.001,a.currentTime);g.gain.exponentialRampToValueAtTime(gain,a.currentTime+.08);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+dur);
  s.connect(f).connect(g).connect(a.destination);s.start();
}
function chime(){
  const a=ctx(); if(!a||!S.sfx)return;
  [880,1175,1568,2093].forEach((fr,k)=>{const o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.value=fr;
    const t=a.currentTime+k*.09;g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.18,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.5);
    o.connect(g).connect(a.destination);o.start(t);o.stop(t+.55)});
}
function growl(){
  const a=ctx(); if(!a||!S.sfx)return;
  const o=a.createOscillator(),g=a.createGain();o.type='sawtooth';o.frequency.setValueAtTime(90,a.currentTime);o.frequency.linearRampToValueAtTime(55,a.currentTime+1.1);
  g.gain.setValueAtTime(.001,a.currentTime);g.gain.exponentialRampToValueAtTime(.25,a.currentTime+.1);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+1.2);
  o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+1.25);noise(1.1,600,120,.25);
}
const FXSOUND={roar:growl,grab:()=>noise(1.6,2000,300,.2,'bandpass'),item:chime,dress:()=>{noise(.15,4000,3000,.3,'highpass');setTimeout(()=>noise(.15,4000,3000,.3,'highpass'),220);setTimeout(chime,450)},
  fix:chime,fire:()=>noise(1.3,300,2500,.45),fly:()=>noise(2,400,1600,.3,'bandpass'),sleep:()=>{},erase:()=>{for(let k=0;k<4;k++)setTimeout(()=>noise(.2,2500,1200,.25,'bandpass'),k*230);setTimeout(chime,1000)}};

/* ---------- rendering ---------- */
const $=s=>document.querySelector(s);
function esc(t){return String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function blankify(t){
  if(!S.blanks) return esc(t);
  let out=esc(t);
  ['scissors','a glue stick','a pencil','an eraser'].forEach(w=>{ out=out.replace(new RegExp(w.replace(' ','\\s'),'g'),'<span class="blank">'+w+'</span>') });
  return out;
}

function renderTabs(){
  $('#tabs').innerHTML = PAGES.map(p=>`<button class="tab" data-p="${p.id}" aria-current="${S.page===p.id}">${p.id.startsWith('s')&&p.id!=='story'?'장면 '+p.label:p.label}${p.sub&&!p.id.startsWith('s')?`<small>${p.sub}</small>`:''}</button>`).join('');
  $('#tabs').querySelectorAll('.tab').forEach(b=>b.onclick=()=>go(b.dataset.p));
}

function go(p){ stopSpeech(); S.page=p; S.line=0; S.revealed={}; S.fired={}; render(); }

function render(){
  renderTabs();
  const sc=curScene();
  if(sc) return renderScene(sc);
  if(S.page==='thorn') return renderThorn();
  $('#ctrl').innerHTML='';
  if(S.page==='cover') renderCover();
  if(S.page==='story') renderStory();
  if(S.page==='roles') renderRoles();
  if(S.page==='tools') renderTools();
}

/* image override per scene (teacher's own art) */
let IMG={};
const idb = (()=>{ let db=null; return {
  open(){ return new Promise(r=>{ try{ const q=indexedDB.open('pb-art',1); q.onupgradeneeded=()=>q.result.createObjectStore('img'); q.onsuccess=()=>{db=q.result;r()}; q.onerror=()=>r(); }catch(e){r()} }) },
  put(k,v){ try{ db&&db.transaction('img','readwrite').objectStore('img').put(v,k) }catch(e){} },
  del(k){ try{ db&&db.transaction('img','readwrite').objectStore('img').delete(k) }catch(e){} },
  all(){ return new Promise(r=>{ try{ if(!db) return r({}); const o={}; const st=db.transaction('img').objectStore('img'); const c=st.openCursor(); c.onsuccess=()=>{const cur=c.result; if(cur){o[cur.key]=cur.value;cur.continue()} else r(o)}; c.onerror=()=>r({}); }catch(e){r({})} }) }
};})();

  if(IMG[key]) return `<img src="${IMG[key]}" alt="교사가 넣은 장면 그림">`;

}

   <section class="stagewrap">
     <div class="scenecap"><h2>장면 ${sc.id}. ${sc.title}${sc.original?'<span class="badge">원작 장면</span>':''}${sc.ending?`<span class="badge">${DATA.scenes[5].endings[S.ending].name}</span>`:''}</h2>
       <div class="imgtools"><span class="place">${sc.place}</span>
       <button class="iconbtn" id="imgUp" title="직접 만든 그림으로 바꾸기">그림 바꾸기</button>${IMG[key]?'<button class="iconbtn" id="imgReset">기본 그림</button>':''}</div></div>
     <div class="stage" id="stage">${stageHTML(key,RENDER[sc.bg](L,S.line))}</div>

     ${sc.ending?`<div class="endpick">${['A','B'].map(k=>`<button data-end="${k}" aria-pressed="${S.ending===k}"><b>${DATA.scenes[5].endings[k].name}</b>${DATA.scenes[5].endings[k].desc}</button>`).join('')}</div>`:''}

  if($('#imgReset')) $('#imgReset').onclick=()=>{ delete IMG[key]; idb.del(key); render(); };

function lineHTML(l,i){
  const cur=i===S.line?'cur':i<S.line?'done':'';
  if(l.r==='N') return `<button class="line narr ${cur}" data-i="${i}"><span class="chip">이야기</span><span class="story">${esc(l.t)}</span><span></span></button>`;
  const hid = S.hideRole===l.r ? 'hidden-line'+(S.revealed[i]?' revealed':'') : '';
  return `<button class="line ${cur} ${l.key?'key':''} ${hid}" data-i="${i}">
     <span class="chip" style="background:${RC[l.r]}">${ROLE[l.r].ko}<small>${ROLE[l.r].en}</small></span>
     <span class="en">${blankify(l.t)}<span class="ko">${esc(l.k||'')}</span></span>
     <span class="say" data-say="${i}" role="button" aria-label="듣기">▶</span></button>`;
}
function bindLines(L){
  document.querySelectorAll('#lines .line').forEach(b=>b.onclick=e=>{
    const i=+b.dataset.i;
    if(b.classList.contains('hidden-line') && i===S.line && !S.revealed[i]){ S.revealed[i]=true; refreshScene(); return; }
    stopSpeech(); setLine(i, !!e.target.closest('[data-say]'));
  });
}
function scrollCur(){ const c=document.querySelector('.line.cur'); if(c) c.scrollIntoView({block:'nearest'}); }
function refreshScene(){
  const sc=curScene(); if(!sc){ if(S.page==='thorn') renderThorn(); return; }
  const L=sceneLines(sc);
  $('#stage').innerHTML=stageHTML('s'+sc.id,RENDER[sc.bg](L,S.line));
  $('#lines').innerHTML=L.map((l,i)=>lineHTML(l,i)).join('');
  bindLines(L); scrollCur(); updateCtrl();
}
function setLine(i,speakIt){
  const sc=curScene(); const L=sceneLines(sc);
  S.line=Math.max(0,Math.min(L.length-1,i));
  refreshScene();
  const l=L[S.line];
  if(l.fx && FXSOUND[l.fx]) FXSOUND[l.fx]();
  if(speakIt) return speakLine(l);
}
async function speakLine(l){
  if(l.r==='N' && !S.narrTTS) return;
  await speak(l.t,l.r);
}
async function playAll(){
  if(S.playing){ stopSpeech(); updateCtrl(); return; }
  const sc=curScene(); const L=sceneLines(sc);
  S.playing=true; updateCtrl();
  for(let i=S.line;i<L.length;i++){
    if(!S.playing) break;
    S.line=i; refreshScene();
    const l=L[i]; if(l.fx&&FXSOUND[l.fx]) FXSOUND[l.fx]();
    if(l.r==='N'){ if(S.narrTTS) await speak(l.t,'N'); else await wait(Math.min(5200,1400+l.t.length*55)); }
    else{
      await speak(l.t,l.r);

}
function skipNarr(dir){
  const sc=curScene(); if(!sc||S.showNarr) return;
  const L=sceneLines(sc); let i=S.line;
  while(L[i]&&L[i].r==='N'&&i+dir>=0&&i+dir<L.length) i+=dir;
  if(i!==S.line) setLine(i,false);
}
function nextLine(){
  const sc=curScene(); if(!sc) return;
  const L=sceneLines(sc);
  if(S.line>=L.length-1){ const idx=PAGES.findIndex(p=>p.id===S.page); if(PAGES[idx+1]) go(PAGES[idx+1].id); return; }
  let i=S.line+1; if(!S.showNarr) while(L[i]&&L[i].r==='N'&&i<L.length-1) i++;

}

  s6A:['s6_A_happy','s6_A_happy','s6_A_happy','s6_A_happy','s6_A_happy'],
  s6B:['s6_B1_messy','s6_B1_messy','s6_B1_messy','s6_B2_dance','s6_B2_dance']
};
const SFXMAP = { // key -> {lineIndex(0-based): [sfx...]}
  s1:{1:['roar'],6:['wings']}, s2:{2:['magic'],5:['snip','paper']}, s3:{2:['magic'],4:['glue','tada']},
  s4:{0:['knock'],1:['knock'],5:['fire'],7:['puff'],9:['zoom'],12:['snore']},
  s5:{1:['bars'],6:['magic'],7:['erase','tada']}, s6A:{2:['yay']}, s6B:{4:['tada']}
};
const ITEMPOP = { s2:{2:'scissors'}, s3:{2:'gluestick'}, s5:{6:'eraser'} };
const VIDMAP = { s1:{1:'v_s1a_land',6:'v_s1b_flyaway'}, s2:{5:'v_s2_dress'}, s3:{4:'v_s3_bridge'},
  s4:{5:'v_s4_fire',9:'v_s4_fly',12:'v_s4_sleep'}, s5:{7:'v_s5_erase'}, s6B:{3:'v_s6_dance'} };
const BGMMAP = {cover:'castle',story:'castle',roles:'castle',s1:'castle',s2:'adventure',s3:'adventure',s4:'cave',s5:'cave',thorn:'adventure',tools:'practice'};
const ROLEFILE = {P:'princess',R:'prince',F:'fairy',D:'dragon',N:'narrator'};

S.narrTTS = true;           // recorded narration exists → read it by default
S.bgm = true;
try{ const v=localStorage.getItem('pb-bgm'); if(v!==null) S.bgm = v==='1'; }catch(e){}

function skey(){ const sc=curScene(); if(!sc) return S.page; return sc.ending ? 's6'+S.ending : 's'+sc.id; }
function fileRate(){ return S.rate/0.85; }

/* ---------- audio ---------- */
let bgmEl=null, bgmName='', voiceEl=null;
function bgmTarget(){ if(S.page==='s6') return S.ending==='A'?'happy_end':'dance_end'; return BGMMAP[S.page]||'castle'; }
function updateBGM(){
  const want = S.bgm ? bgmTarget() : '';
  if(!want){ if(bgmEl) bgmEl.pause(); return; }
  if(want!==bgmName || !bgmEl){
    if(bgmEl) bgmEl.pause();
    bgmEl = new Audio('bgm/bgm_'+want+'.mp3'); bgmEl.loop = true; bgmEl.volume = .22; bgmName = want;
  }
  if(!videoPlaying) bgmEl.play().catch(()=>{});
}
function duck(on){ if(bgmEl) bgmEl.volume = on ? .07 : .22; }
function playSfx(name){
  if(!S.sfx) return;
  try{ const a=new Audio('sfx/sfx_'+name+'.mp3'); a.volume=.7; a.play().catch(()=>{}); }catch(e){}
}
function playFile(url){
  return new Promise(res=>{
    try{ if(voiceEl){ voiceEl.pause(); } }catch(e){}
    const a = new Audio(url); voiceEl = a;
    a.preservesPitch = true; a.playbackRate = fileRate();
    let done=false; const fin=ok=>{ if(!done){ done=true; duck(false); res(ok); } };
    a.onended=()=>fin(true); a.onerror=()=>fin(false);
    duck(true);
    a.play().catch(()=>fin(false));
  });
}
const _stopSpeech = stopSpeech;
stopSpeech = function(){ _stopSpeech(); try{ if(voiceEl) voiceEl.pause(); }catch(e){} duck(false); };

function voiceUrl(key,i,role){
  const f = `line_${key}_${String(i+1).padStart(2,'0')}_${ROLEFILE[role]}.mp3`;
  return VOICES.has(f) ? 'voice/'+f : null;
}
async function sayLine(l,key,i){
  const url = voiceUrl(key,i,l.r);
  if(url){ const ok = await playFile(url); if(ok) return; }
  await speak(l.t,l.r);
}
speakLine = async function(l){
  if(l.r==='N' && !S.narrTTS) return;
  const sc=curScene(); if(!sc) return speak(l.t,l.r);
  await sayLine(l, skey(), S.line);
};

/* ---------- stage ---------- */
function imgFor(key,i){ const m=IMGMAP[key]; return m ? 'img/'+m[Math.min(i,m.length-1)]+'.jpg' : null; }
function thornImg(){ return 'img/thorn_'+DATA.thorn.options[S.thorn].item+'.jpg'; }
stageHTML = function(key){
  const src = key==='thorn' ? thornImg() : imgFor(skey(), S.line);
  const myst = key==='thorn' && S.fired.thorn!=='done';
  return `<img id="scimg" class="${myst?'mystery':''}" src="${src}" alt="">${myst?'<div class="mtext">어떤 학용품으로 빠져나갈까?</div>':''}<div id="itempop" hidden></div>
    <div id="vidlayer" hidden><video id="vid" playsinline></video><button class="vclose" id="vclose">닫기 ✕</button></div>`;
};
function updateStage(){
  const im=document.getElementById('scimg'); if(!im){ document.getElementById('stage').innerHTML=stageHTML(S.page==='thorn'?'thorn':''); bindVideoClose(); return; }
  const src = S.page==='thorn' ? thornImg() : imgFor(skey(), S.line);
  if(S.page==='thorn'){ const myst=S.fired.thorn!=='done'; im.classList.toggle('mystery',myst); const t=document.querySelector('.mtext'); if(t) t.hidden=!myst; }
  if(src && !im.src.endsWith(src)){ im.classList.remove('fadein'); void im.offsetWidth; im.src=src; im.classList.add('fadein'); }
}
function showItem(name){
  const p=document.getElementById('itempop'); if(!p) return;
  p.innerHTML=`<img src="img/item_${name}.jpg" alt="">`; p.hidden=false; p.classList.remove('popin'); void p.offsetWidth; p.classList.add('popin');
  clearTimeout(showItem.t); showItem.t=setTimeout(()=>{p.hidden=true},2200);
}
function lineEffects(key,i){
  (SFXMAP[key]&&SFXMAP[key][i]||[]).forEach((n,k)=>setTimeout(()=>playSfx(n),k*450));
  const it=ITEMPOP[key]&&ITEMPOP[key][i]; if(it) showItem(it);
}
function preload(key){ (IMGMAP[key]||[]).forEach(n=>{ const im=new Image(); im.src='img/'+n+'.jpg'; }); }

/* ---------- video ---------- */
let videoPlaying=false, vidQueue=[];
function bindVideoClose(){ const b=document.getElementById('vclose'); if(b) b.onclick=stopVideo; }
function playVideos(list){
  stopSpeech(); S.playing=false; updateCtrl();
  vidQueue=list.slice(); nextVideo();
}
function nextVideo(){
  const name=vidQueue.shift(); const layer=document.getElementById('vidlayer'), v=document.getElementById('vid');
  if(!name||!layer){ stopVideo(); return; }
  layer.hidden=false; videoPlaying=true; if(bgmEl) bgmEl.pause();
  v.src='video/'+name+'.mp4'; v.currentTime=0; v.muted=false; v.play().catch(()=>{});
  v.onended=nextVideo;
}
function stopVideo(){
  vidQueue=[]; const layer=document.getElementById('vidlayer'), v=document.getElementById('vid');
  if(v){ v.pause(); v.removeAttribute('src'); v.load(); } if(layer) layer.hidden=true;
  videoPlaying=false; updateBGM();
}
function sceneVideos(key){ const m=VIDMAP[key]; return m ? Object.keys(m).sort((a,b)=>a-b).map(k=>m[k]) : []; }

/* ---------- scene rendering overrides ---------- */
lineHTML = function(l,i){
  const key=skey(); const vid=VIDMAP[key]&&VIDMAP[key][i];
  const cur=i===S.line?'cur':i<S.line?'done':'';
  const vbtn = vid ? `<span class="vidbtn" data-vid="${vid}" role="button" title="이 장면 영상 보기">🎬</span>` : '';
  if(l.r==='N') return `<button class="line narr ${cur}" data-i="${i}"><span class="chip">이야기</span><span class="story">${esc(l.t)}</span><span class="acts2">${vbtn}<span class="say" data-say="${i}" role="button" aria-label="듣기">▶</span></span></button>`;
  const hid = S.hideRole===l.r ? 'hidden-line'+(S.revealed[i]?' revealed':'') : '';
  return `<button class="line ${cur} ${l.key?'key':''} ${hid}" data-i="${i}">
     <span class="chip" style="background:${RC[l.r]}">${ROLE[l.r].ko}<small>${ROLE[l.r].en}</small></span>
     <span class="en">${blankify(l.t)}<span class="ko">${esc(l.k||'')}</span></span>
     <span class="acts2">${vbtn}<span class="say" data-say="${i}" role="button" aria-label="듣기">▶</span></span></button>`;
};
bindLines = function(L){
  document.querySelectorAll('#lines .line').forEach(b=>b.onclick=e=>{
    const i=+b.dataset.i;
    const v=e.target.closest('[data-vid]');
    if(v){ stopSpeech(); S.line=i; refreshScene(); playVideos([v.dataset.vid]); return; }
    if(b.classList.contains('hidden-line') && i===S.line && !S.revealed[i]){ S.revealed[i]=true; refreshScene(); return; }
    stopSpeech(); setLine(i, !!e.target.closest('[data-say]') || true);
  });
};
refreshScene = function(){
  const sc=curScene(); if(!sc){ if(S.page==='thorn') renderThorn(); return; }
  const L=sceneLines(sc);
  updateStage();
  $('#lines').innerHTML=L.map((l,i)=>lineHTML(l,i)).join('');
  bindLines(L); scrollCur(); updateCtrl();
};
setLine = function(i,speakIt){
  const sc=curScene(); const L=sceneLines(sc);
  S.line=Math.max(0,Math.min(L.length-1,i));
  refreshScene();
  lineEffects(skey(), S.line);
  if(speakIt) return speakLine(L[S.line]);
};
renderScene = function(sc){
  stopVideo();
  const L=sceneLines(sc);
  if(S.line>=L.length) S.line=L.length-1;
  const key=skey(); preload(key);
  const vids=sceneVideos(key);
  $('#main').innerHTML = `
   <section class="stagewrap">
     <div class="scenecap"><h2>장면 ${sc.id}. ${sc.title}${sc.original?'<span class="badge">원작 장면</span>':''}${sc.ending?`<span class="badge">${DATA.scenes[5].endings[S.ending].name}</span>`:''}</h2>
       <div class="imgtools"><span class="place">${sc.place}</span>${vids.length?`<button class="iconbtn" id="vidAll">🎬 장면 영상 보기</button>`:''}</div></div>
     <div class="stage" id="stage">${stageHTML(key)}</div>
   </section>
   <section class="sheet ${S.showKo?'':'hide-ko'} ${S.showNarr?'':'hide-narr'}">
     <div class="sheethead"><b>대본 · Scene ${sc.id}</b>
       <span style="font-size:.85rem;color:var(--ink-soft)">줄을 누르면 그 줄을 들려줘요 · 🎬 영상</span></div>
     ${sc.ending?`<div class="endpick">${['A','B'].map(k=>`<button data-end="${k}" aria-pressed="${S.ending===k}"><b>${DATA.scenes[5].endings[k].name}</b>${DATA.scenes[5].endings[k].desc}</button>`).join('')}</div>`:''}
     <div class="lines" id="lines">${L.map((l,i)=>lineHTML(l,i)).join('')}</div>
   </section>`;
  bindLines(L); bindVideoClose();
  if(sc.ending) document.querySelectorAll('[data-end]').forEach(b=>b.onclick=()=>{stopSpeech();S.ending=b.dataset.end;S.line=0;savePrefs();render()});
  if(vids.length) $('#vidAll').onclick=()=>playVideos(vids);
  renderCtrl(true);
  const n=$('#narr'); if(n) n.value = !S.showNarr?'h':(S.narrTTS?'v':'t');
  scrollCur();
};
playAll = async function(){
  if(S.playing){ stopSpeech(); updateCtrl(); return; }
  const sc=curScene(); const L=sceneLines(sc); const key=skey();
  S.playing=true; updateCtrl();
  for(let i=S.line;i<L.length;i++){
    if(!S.playing) break;
    S.line=i; refreshScene(); lineEffects(key,i);
    const l=L[i];
    if(l.r==='N'){ if(S.narrTTS) await sayLine(l,key,i); else await wait(Math.min(5200,1400+l.t.length*55)); }
    else{
      await sayLine(l,key,i);
      if(S.repeat && S.playing){ markRepeat(true); await wait(1500+l.t.length*110/S.rate); markRepeat(false); }
      else await wait(400);
    }
  }
  S.playing=false; updateCtrl();
};

/* thorn */
const _renderThorn = renderThorn;
renderThorn = function(){ _renderThorn(); bindVideoClose(); };
playThorn = async function(){
  const o=DATA.thorn.options[S.thorn], it=o.item;
  S.fired.thorn=null; updateStage();
  const q=VOICES.has(`line_thorn_${it}_princess.mp3`)?`voice/line_thorn_${it}_princess.mp3`:null;
  if(!(q && await playFile(q))) await speak(o.q,'P');
  await wait(250); playSfx('magic'); showItem(it==='glue'?'gluestick':it);
  const a=VOICES.has(`line_thorn_${it}_fairy.mp3`)?`voice/line_thorn_${it}_fairy.mp3`:null;
  if(!(a && await playFile(a))) await speak(o.a,'F');
  await wait(400); S.fired.thorn='done'; updateStage(); playSfx(it==='scissors'?'snip':it==='eraser'?'erase':'tada'); setTimeout(()=>playSfx('tada'),700);
};

/* cover & roles */
renderCover = function(){
  $('#main').innerHTML=`<section class="page"><div class="cover">
    <div>
      <div class="eyebrow">3학년 영어 · Lesson 7 I Have a Pencil · Story Land</div>
      <h1>종이 봉지 공주의<br><em>왕자 구출 대작전</em></h1>
      <p>용에게 잡혀간 왕자를 구하러 종이 봉지 옷을 입고 길을 떠난 공주. 교과서 이야기에 원작 『종이 봉지 공주』의 장면과 결말을 더해, 네 명이 한 모둠이 되어 역할극을 연습해요.</p>
      <div class="goal"><b style="font-family:var(--f-display);font-weight:400">오늘의 핵심 표현</b>
        <span>A: Do you have scissors?</span><span>B: Yes, I do. / No, I don't.</span><span>I have an eraser.</span></div>
      <div class="row" style="margin-top:18px"><button class="big" id="startBtn">이야기 시작하기</button><button class="big alt" id="opBtn">🎬 오프닝 영상</button><button class="big alt" id="rolesBtn">역할 정하기</button></div>
    </div>
    <div class="stage" id="stage"><video id="covervid" src="video/v_cover.mp4" poster="img/cover.jpg" autoplay muted loop playsinline></video></div>
  </div></section>`;
  $('#startBtn').onclick=()=>go('s1'); $('#rolesBtn').onclick=()=>go('roles');
  $('#opBtn').onclick=()=>{ const v=$('#covervid'); v.loop=false; v.muted=false; v.currentTime=0; if(bgmEl) bgmEl.pause(); videoPlaying=true; v.play().catch(()=>{}); v.onended=()=>{v.muted=true;v.loop=true;v.play().catch(()=>{});videoPlaying=false;updateBGM();}; };
};
portrait = function(r){ const f={P:'princess_bag',R:'prince',F:'fairy',D:'dragon'}[r]; return `<img class="portrait" src="img/char_${f}.jpg" alt="${ROLE[r].ko}">`; };

/* render hook → BGM */
const _render = render;
render = function(){ _render(); updateBGM(); };

/* header BGM toggle */
const hb=document.getElementById('bgmBtn');
if(hb){ hb.setAttribute('aria-pressed',S.bgm); hb.onclick=()=>{ S.bgm=!S.bgm; try{localStorage.setItem('pb-bgm',S.bgm?'1':'0')}catch(e){} hb.setAttribute('aria-pressed',S.bgm); updateBGM(); }; }
/* browsers block audio until the first click: start BGM then */
document.addEventListener('pointerdown',function once(){ updateBGM(); document.removeEventListener('pointerdown',once); },{once:true});

render();
})();

</script>
</body>
</html>
